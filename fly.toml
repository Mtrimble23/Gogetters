# fly.toml app configuration file generated for financial-api on 2024-09-28
app = "vthacks26-financial-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.financial-api"

[env]
  PYTHONPATH = "/app"
  PYTHONUNBUFFERED = "1"
  PYTHONDONTWRITEBYTECODE = "1"
  GEMINI_API_KEY = "AIzaSyDLTtbDamrXYLo4Q2I2btd9g8FVVJAAqHc"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[[statics]]
  guest_path = "/app/static"
  url_prefix = "/static/"